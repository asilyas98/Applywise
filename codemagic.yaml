# Applywise — build and upload an iOS IPA to TestFlight.
workflows:
  ios-testflight:
    name: Applywise iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simpleai.aijob

      groups:
        - applywise

      vars:
        APP_STORE_APPLE_ID: "6833152765"
        APP_BUNDLE_ID: com.simpleai.aijob
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

      node: 22
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Set the registered Apple bundle ID
        script: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const appId = process.env.APP_BUNDLE_ID;
          const configPath = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

          config.appId = appId;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');

          const projectPath = 'ios/App/App.xcodeproj/project.pbxproj';
          let project = fs.readFileSync(projectPath, 'utf8');

          if (!/PRODUCT_BUNDLE_IDENTIFIER\s*=/.test(project)) {
            throw new Error('Xcode bundle ID setting was not found');
          }

          project = project.replace(
            /(PRODUCT_BUNDLE_IDENTIFIER\s*=\s*)[^;]+;/g,
            `$1${appId};`
          );

          fs.writeFileSync(projectPath, project);
          console.log(`Configured ${appId}`);
          NODE

      - name: Check release configuration
        script: |
          node -e 'for (const k of ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY", "VITE_API_BASE", "APP_STORE_APPLE_ID", "APP_STORE_CONNECT_PRIVATE_KEY", "APP_STORE_CONNECT_KEY_IDENTIFIER", "APP_STORE_CONNECT_ISSUER_ID"]) { if (!process.env[k] || /YOUR-|0000000000/.test(process.env[k])) { console.error(`Missing or placeholder environment variable: ${k}`); process.exitCode = 1; } }'
          node -e 'const fs=require("fs"); const p=fs.readFileSync("ios/App/App.xcodeproj/project.pbxproj","utf8"); if (!p.includes("PRODUCT_BUNDLE_IDENTIFIER = com.simpleai.aijob;")) process.exit(1);'

      - name: Build web app and sync iOS
        script: |
          npm run build
          npx cap sync ios

      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios/App/App/Info.plist
          echo "Build number $NEXT"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true